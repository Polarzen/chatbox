name: Publish and verify Chatbox 0.1.19
on:
  push:
    branches: [qa/v0.1.15-to-v0.1.19]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Polarzen/chatbox
    steps:
      - name: Verify both accepted installers, publish the existing draft, verify downloads
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.1.19
          gh release view "$tag" --json isDraft,targetCommitish | jq -e '.isDraft and .targetCommitish == "5a671cfc1ac15cc12c4d5afcc6e952cb1a734cd5"'
          gh api repos/Polarzen/chatbox/git/blobs/3f97df92e704d9adf5a95d6a3bf2f5897be5d556 --jq .content | base64 -d > Chatbox-0.1.19.apk
          printf '%s  %s\n' 39bdba134e2e580c3a8c23d829a7566bb20ecbc0e4f784781e3b4ef4a2e3b252 Chatbox-0.1.19.apk c915f64ef4246bedec780758ba97ae41afe710df35e1b1d0c80e4d3aef7cdc32 Chatbox-0.1.19.msi > SHA256SUMS.txt
          gh release download "$tag" --pattern Chatbox-0.1.19.msi
          sha256sum -c SHA256SUMS.txt
          gh release upload "$tag" Chatbox-0.1.19.apk SHA256SUMS.txt
          verify_assets() {
            local directory="$1"
            mkdir "$directory"
            gh release download "$tag" --dir "$directory" --pattern 'Chatbox-0.1.19.*' --pattern SHA256SUMS.txt
            cmp SHA256SUMS.txt "$directory/SHA256SUMS.txt"
            (cd "$directory" && sha256sum -c SHA256SUMS.txt)
          }
          verify_assets staged
          gh release edit "$tag" --draft=false --latest
          verify_assets published
          gh api repos/Polarzen/chatbox/releases/latest --jq .tag_name | grep -Fx v0.1.19
