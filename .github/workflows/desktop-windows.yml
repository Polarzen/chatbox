name: Chatbox Windows verification
on:
  push:
    branches: ['feat/desktop-mvp', 'main']
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Parse uninstall scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $scripts = @(Get-ChildItem 'desktop\uninstall\*.ps1' -File) + @(
            Get-Item 'desktop\test-windows-uninstall.ps1'
            Get-Item 'desktop\test-uninstall-safety.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) { throw "$($script.Name): $($parseErrors -join [Environment]::NewLine)" }
          }
      - name: Verify WiX and run tests, smoke checks and MSI packaging
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem -Path "${env:ProgramFiles(x86)}\WiX Toolset v3*" -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
            if (-not $wix) { throw "WiX Toolset v3 not found on runner." }
            Add-Content -Path $env:GITHUB_PATH -Value "$($wix.FullName)\bin"
            $env:PATH = "$($wix.FullName)\bin;$env:PATH"
          }
          Get-Command candle.exe,light.exe -ErrorAction Stop
          .\gradlew.bat -p desktop --no-daemon test desktopSmoke createDistributable packageMsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract the MSI and smoke-test its Windows executable
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem "desktop\build\compose\binaries\main\msi\*.msi" -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one MSI package." }
          $unpacked = Join-Path $env:RUNNER_TEMP "chatbox-msi-extract"
          $log = Join-Path $env:RUNNER_TEMP "chatbox-msi-extract.log"
          $msi = Start-Process -FilePath msiexec.exe -ArgumentList "/a `"$($packages[0].FullName)`" /qn TARGETDIR=`"$unpacked`" /L*v `"$log`"" -Wait -PassThru
          if ($msi.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 100 }
            throw "MSI extraction failed: $($msi.ExitCode)"
          }
          $executables = @(Get-ChildItem $unpacked -Recurse -File -Filter "Chatbox.exe")
          if ($executables.Count -ne 1) { throw "Expected exactly one packaged Chatbox.exe." }
          $exe = $executables[0]
          $marker = Join-Path $env:RUNNER_TEMP "chatbox-smoke-marker.txt"
          if (Test-Path $marker) { Remove-Item $marker }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test `"$marker`"" -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Packaged app did not finish its smoke check." }
          if ($process.ExitCode -ne 0) { throw "Packaged smoke check failed: $($process.ExitCode)" }
          if (-not (Test-Path $marker) -or (Get-Content -Raw $marker) -ne "chatbox-smoke-ok") { throw "Packaged smoke marker was not written." }
          & .\desktop\test-windows-upgrade.ps1 -MsiPath $packages[0].FullName -CandidateRoot $unpacked
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Chatbox-Windows-MSI-Upgrade-Logs
          path: ${{ runner.temp }}/chatbox-upgrade-regression-*/*.log
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Chatbox-Windows-MSI
          path: desktop/build/compose/binaries/main/msi/*.msi
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chatbox-Windows-Test-Report
          path: desktop/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore
  windows-uninstall:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Chatbox-Windows-MSI
          path: ${{ runner.temp }}/chatbox-uninstall-package
      - name: Install and completely uninstall the packaged Windows app
        shell: powershell
        run: |
          $packages = @(Get-ChildItem "${{ runner.temp }}\chatbox-uninstall-package\*.msi" -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one verified MSI package.' }
          & .\desktop\test-windows-uninstall.ps1 -MsiPath $packages[0].FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chatbox-Windows-Uninstall-Logs
          path: |
            ${{ runner.temp }}/chatbox-uninstall-regression-*/**/*.log
            ${{ runner.temp }}/chatbox-uninstall-regression-*/**/*.json
            ${{ runner.temp }}/chatbox-uninstall-regression-*/**/*.txt
          retention-days: 7
          if-no-files-found: ignore
  android-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Android debug and release variants and assemble both APKs
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease
      - name: Verify release APK identity and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          version_code=$(sed -nE 's/^ *versionCode = ([0-9]+).*$/\1/p' app/build.gradle.kts)
          version_name=$(sed -nE 's/^ *versionName = "([^"]+)".*$/\1/p' app/build.gradle.kts)
          "$aapt2" dump badging "$apk" > "$RUNNER_TEMP/chatbox-badging"
          grep -F "package: name='dev.polarzen.chatbox' versionCode='$version_code' versionName='$version_name'" "$RUNNER_TEMP/chatbox-badging"
          grep -Fx "application-label:'Chat Box'" "$RUNNER_TEMP/chatbox-badging"
          "$aapt2" dump resources "$apk" > "$RUNNER_TEMP/chatbox-resources"
          "$aapt2" dump xmltree "$apk" --file AndroidManifest.xml > "$RUNNER_TEMP/chatbox-manifest"

          # Read compiled paths from the APK table; release optimizations may shorten filenames.
          awk '/^[[:space:]]*resource 0x/ { show = ($0 ~ /[ :/]mipmap\/ic_launcher([[:space:]]|$)/) } show' \
            "$RUNNER_TEMP/chatbox-resources" > "$RUNNER_TEMP/chatbox-launcher"
          icon_id=$(awk '/resource 0x/ {print $2; exit}' "$RUNNER_TEMP/chatbox-launcher")
          test -n "$icon_id"
          for attribute in icon roundIcon; do
            grep -E "android:${attribute}\\([^)]*\\)=@${icon_id}([[:space:]]|$)" "$RUNNER_TEMP/chatbox-manifest"
          done
          cat "$RUNNER_TEMP/chatbox-launcher"
          mapfile -t paths < <(grep -oE '[[:alnum:]_./-]+\.xml' "$RUNNER_TEMP/chatbox-launcher" | sort -u)
          test "${#paths[@]}" -eq 2
          monochrome_count=0
          for path in "${paths[@]}"; do
            "$aapt2" dump xmltree "$apk" --file "$path" > "$RUNNER_TEMP/chatbox-icon"
            for element in adaptive-icon background foreground; do
              grep -E "E: ${element}([[:space:]]|$)" "$RUNNER_TEMP/chatbox-icon"
            done
            if grep -E 'E: monochrome([[:space:]]|$)' "$RUNNER_TEMP/chatbox-icon"; then
              monochrome_count=$((monochrome_count + 1))
            fi
          done
          test "$monochrome_count" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: Chat-Box-Android-Unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error
  release-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, windows-uninstall, android-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: chatbox-windows-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Select a new version with release notes
        id: release
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          source = Path('desktop/build.gradle.kts').read_text(encoding='utf-8')
          versions = re.findall(r'^val windowsPackageVersion = "([0-9]+\.[0-9]+\.[0-9]+)"$', source, re.MULTILINE)
          if len(versions) != 1:
              raise SystemExit('Expected exactly one Windows package version.')
          version = versions[0]
          tag = 'v' + version
          notes = Path('docs/releases') / ('windows-' + version + '.md')
          publish = notes.is_file()
          repo = os.environ['GITHUB_REPOSITORY']
          if not publish:
              print('No versioned Windows release notes; verification only.')
          else:
              result = subprocess.run(['gh', 'release', 'view', tag, '--repo', repo, '--json', 'tagName'], text=True, capture_output=True)
              if result.returncode == 0:
                  publish = False
                  print('Release ' + tag + ' already exists; its files will not be changed.')
              elif 'release not found' not in result.stderr.lower() and 'http 404' not in result.stderr.lower():
                  raise SystemExit(result.stderr or 'Could not check whether the release exists.')
          if publish:
              result = subprocess.run(['gh', 'api', 'repos/' + repo + '/git/ref/tags/' + tag], text=True, capture_output=True)
              if result.returncode == 0:
                  resolved = subprocess.run(['gh', 'api', 'repos/' + repo + '/commits/' + tag], text=True, capture_output=True, check=True)
                  if json.loads(resolved.stdout)['sha'] != os.environ['GITHUB_SHA']:
                      raise SystemExit('The existing tag points to a different commit; refusing to publish.')
              elif 'http 404' not in result.stderr.lower():
                  raise SystemExit(result.stderr or 'Could not check the release tag.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('publish=' + str(publish).lower() + '\n')
              output.write('version=' + version + '\n')
              output.write('notes=' + notes.as_posix() + '\n')
          temporary = Path(os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write('CHATBOX_RELEASE_INPUT=' + str(temporary / 'chatbox-release-input') + '\n')
              environment.write('CHATBOX_RELEASE_OUTPUT=' + str(temporary / 'chatbox-release-output') + '\n')
          PY
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: Chatbox-Windows-MSI
          path: ${{ env.CHATBOX_RELEASE_INPUT }}
      - name: Package standalone uninstall and checksums
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          CHATBOX_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import zipfile

          version = os.environ['CHATBOX_RELEASE_VERSION']
          incoming = Path(os.environ['CHATBOX_RELEASE_INPUT'])
          output = Path(os.environ['CHATBOX_RELEASE_OUTPUT'])
          output.mkdir(parents=True, exist_ok=False)
          installers = list(incoming.glob('*.msi'))
          expected_name = 'Chatbox-' + version + '.msi'
          if len(installers) != 1 or installers[0].name != expected_name:
              raise SystemExit('The verified artifact does not contain the expected Windows MSI.')
          shutil.copyfile(installers[0], output / expected_name)
          sources = [
              Path('desktop/uninstall/uninstall.cmd'),
              Path('desktop/uninstall/Uninstall-ChatBox.ps1'),
              Path('desktop/uninstall/Uninstall-ChatBoxData.ps1'),
              Path('docs/WINDOWS_FULL_UNINSTALL.md'),
          ]
          archive = output / ('Chatbox-Uninstall-' + version + '.zip')
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as bundle:
              for source in sources:
                  info = zipfile.ZipInfo(source.name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  bundle.writestr(info, source.read_bytes())
          shutil.copyfile('docs/Chatbox-Install-Guide.zh-CN.md', output / 'Chatbox-Install-Guide.zh-CN.md')
          sums = []
          for asset in sorted(output.iterdir()):
              sums.append(hashlib.sha256(asset.read_bytes()).hexdigest() + '  ' + asset.name)
          (output / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('Prepared Windows MSI, standalone uninstall ZIP, guide and SHA256SUMS.txt.')
          PY
      - name: Publish the verified Windows release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          CHATBOX_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CHATBOX_RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        run: |
          set -euo pipefail
          tag="v$CHATBOX_RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' "Release $tag now exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" \
            "$CHATBOX_RELEASE_OUTPUT/Chatbox-$CHATBOX_RELEASE_VERSION.msi" \
            "$CHATBOX_RELEASE_OUTPUT/Chatbox-Uninstall-$CHATBOX_RELEASE_VERSION.zip" \
            "$CHATBOX_RELEASE_OUTPUT/Chatbox-Install-Guide.zh-CN.md" \
            "$CHATBOX_RELEASE_OUTPUT/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Chat Box $CHATBOX_RELEASE_VERSION (Windows)" \
            --notes-file "$CHATBOX_RELEASE_NOTES" --latest
