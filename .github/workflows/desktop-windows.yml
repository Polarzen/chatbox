name: Verify released MSI upgrade 0.1.15 to 0.1.19
on:
  push:
    branches: [qa/v0.1.15-to-v0.1.19]
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the distributed installers and check digests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'desktop/build/compose/binaries/main/msi'
          $old = "v18/$folder"
          $new = "v19/$folder"
          New-Item -ItemType Directory -Force $old,$new | Out-Null
          gh release download v0.1.15 --pattern '*.msi' --pattern SHA256SUMS.txt --dir $old
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh run download 45525891484 --name Chatbox-Windows-MSI --dir artifact
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $candidate = @(Get-ChildItem artifact -Recurse -Filter Chatbox-0.1.19.msi)
          if ($candidate.Count -ne 1) { throw 'Expected one distribution MSI' }
          Copy-Item $candidate[0].FullName $new
          $actual = (Get-FileHash "$old/Chatbox-0.1.15.msi").Hash
          if (-not (Select-String -Path "$old/SHA256SUMS.txt" -Pattern "^$actual\s+\*?Chatbox-0\.1\.15\.msi\s*$")) { throw 'Old MSI checksum mismatch' }
          if ((Get-FileHash "$new/Chatbox-0.1.19.msi").Hash -ne 'c915f64ef4246bedec780758ba97ae41afe710df35e1b1d0c80e4d3aef7cdc32') { throw 'New MSI checksum mismatch' }
          (Get-Content .github/workflows/verify-msi-upgrade.py -Raw).Replace('0.1.18','0.1.15') | Set-Content verify.py -Encoding utf8
          python -B verify.py
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-evidence
          path: ${{ runner.temp }}/chatbox-msi-transaction/evidence/
