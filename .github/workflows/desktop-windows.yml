name: Chatbox Windows verification
on:
  push:
    branches: ['feat/desktop-mvp', 'main']
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Sign Android and publish the verified installers
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify WiX and run tests, smoke checks and MSI packaging
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem -Path "${env:ProgramFiles(x86)}\WiX Toolset v3*" -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
            if (-not $wix) { throw "WiX Toolset v3 not found on runner." }
            Add-Content -Path $env:GITHUB_PATH -Value "$($wix.FullName)\bin"
            $env:PATH = "$($wix.FullName)\bin;$env:PATH"
          }
          Get-Command candle.exe,light.exe -ErrorAction Stop
          .\gradlew.bat -p desktop --no-daemon test desktopSmoke createDistributable packageMsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract the MSI and smoke-test its Windows executable
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem "desktop\build\compose\binaries\main\msi\*.msi" -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one MSI package." }
          $unpacked = Join-Path $env:RUNNER_TEMP "chatbox-msi-extract"
          $log = Join-Path $env:RUNNER_TEMP "chatbox-msi-extract.log"
          $msi = Start-Process -FilePath msiexec.exe -ArgumentList "/a `"$($packages[0].FullName)`" /qn TARGETDIR=`"$unpacked`" /L*v `"$log`"" -Wait -PassThru
          if ($msi.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 100 }
            throw "MSI extraction failed: $($msi.ExitCode)"
          }
          $executables = @(Get-ChildItem $unpacked -Recurse -File -Filter "Chatbox.exe")
          if ($executables.Count -ne 1) { throw "Expected exactly one packaged Chatbox.exe." }
          $exe = $executables[0]
          $marker = Join-Path $env:RUNNER_TEMP "chatbox-smoke-marker.txt"
          if (Test-Path $marker) { Remove-Item $marker }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test `"$marker`"" -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Packaged app did not finish its smoke check." }
          if ($process.ExitCode -ne 0) { throw "Packaged smoke check failed: $($process.ExitCode)" }
          if (-not (Test-Path $marker) -or (Get-Content -Raw $marker) -ne "chatbox-smoke-ok") { throw "Packaged smoke marker was not written." }
          & .\desktop\test-windows-upgrade.ps1 -MsiPath $packages[0].FullName -CandidateRoot $unpacked
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Chatbox-Windows-MSI-Upgrade-Logs
          path: ${{ runner.temp }}/chatbox-upgrade-regression-*/*.log
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Chatbox-Windows-MSI
          path: desktop/build/compose/binaries/main/msi/*.msi
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chatbox-Windows-Test-Report
          path: desktop/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore
  android-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Android debug and release variants and assemble both APKs
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease
      - name: Verify release APK identity and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          version_code=$(sed -nE 's/^ *versionCode = ([0-9]+).*$/\1/p' app/build.gradle.kts)
          version_name=$(sed -nE 's/^ *versionName = "([^"]+)".*$/\1/p' app/build.gradle.kts)
          "$aapt2" dump badging "$apk" > "$RUNNER_TEMP/chatbox-badging"
          grep -F "package: name='dev.polarzen.chatbox' versionCode='$version_code' versionName='$version_name'" "$RUNNER_TEMP/chatbox-badging"
          grep -Fx "application-label:'Chat Box'" "$RUNNER_TEMP/chatbox-badging"
          "$aapt2" dump resources "$apk" > "$RUNNER_TEMP/chatbox-resources"
          "$aapt2" dump xmltree "$apk" --file AndroidManifest.xml > "$RUNNER_TEMP/chatbox-manifest"

          # Read compiled paths from the APK table; release optimizations may shorten filenames.
          awk '/^[[:space:]]*resource 0x/ { show = ($0 ~ /[ :/]mipmap\/ic_launcher([[:space:]]|$)/) } show' \
            "$RUNNER_TEMP/chatbox-resources" > "$RUNNER_TEMP/chatbox-launcher"
          icon_id=$(awk '/resource 0x/ {print $2; exit}' "$RUNNER_TEMP/chatbox-launcher")
          test -n "$icon_id"
          for attribute in icon roundIcon; do
            grep -E "android:${attribute}\\([^)]*\\)=@${icon_id}([[:space:]]|$)" "$RUNNER_TEMP/chatbox-manifest"
          done
          for api in 26 33; do
            path=$(awk -v config="(anydpi-v$api)" '$1 == config && $2 == "(file)" { print $3 }' "$RUNNER_TEMP/chatbox-launcher")
            test -n "$path"
            "$aapt2" dump xmltree "$apk" --file "$path" > "$RUNNER_TEMP/chatbox-icon"
            for element in adaptive-icon background foreground; do
              grep -E "E: ${element}([[:space:]]|$)" "$RUNNER_TEMP/chatbox-icon"
            done
            if [[ "$api" == 33 ]]; then
              grep -E 'E: monochrome([[:space:]]|$)' "$RUNNER_TEMP/chatbox-icon"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Chat-Box-Android-Unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish installers]')))
    needs: [windows, android-regression]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Chatbox-Windows-MSI
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Chat-Box-Android-Unsigned
          path: unsigned
      - name: Prepare matching Windows and Android packages
        shell: bash
        run: |
          set -euo pipefail
          tools_dir=$(find "$ANDROID_HOME/build-tools" -name apksigner -printf '%h\n' | sort -V | tail -1)
          echo "TOOLS_DIR=$tools_dir" >> "$GITHUB_ENV"
          apk=unsigned/app-release-unsigned.apk
          version=$("$tools_dir/aapt2" dump badging "$apk" | sed -nE "s/^package: .*versionName='([^']+)'.*/\1/p")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s "dist/Chatbox-$version.msi"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          "$tools_dir/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
      - name: Sign APK with the existing Android release key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64 with the existing signing keystore}"
          : "${STORE_PASSWORD:?Configure ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Configure ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Configure ANDROID_KEY_PASSWORD}"
          umask 077
          ks="$RUNNER_TEMP/chatbox-release.keystore"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          "$TOOLS_DIR/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "dist/Chatbox-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
      - name: Verify signer continuity and publish both installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          previous=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          gh release download "$previous" --pattern '*.apk' --dir "$RUNNER_TEMP/previous"
          signer() {
            "$TOOLS_DIR/apksigner" verify --print-certs "$1" |
              sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: //p' | sort
          }
          old=$(signer "$RUNNER_TEMP"/previous/*.apk)
          new=$(signer "dist/Chatbox-$VERSION.apk")
          test -n "$old" && test "$old" = "$new" || { echo "Android release signer mismatch"; exit 1; }
          cd dist
          sha256sum "Chatbox-$VERSION.apk" "Chatbox-$VERSION.msi" > SHA256SUMS.txt
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing.json"; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' "$RUNNER_TEMP/existing.json"
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Chat Box $tag" \
              --notes "Windows 和安卓安装包已通过 GitHub Actions 验证。安卓 APK 已与上一正式版比对签名。"
          fi
          gh release upload "$tag" "Chatbox-$VERSION.apk" "Chatbox-$VERSION.msi" SHA256SUMS.txt --clobber
          gh release download "$tag" --pattern 'Chatbox-*' --dir "$RUNNER_TEMP/recheck"
          (cd "$RUNNER_TEMP/recheck" && sha256sum -c "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt")
          gh release edit "$tag" --draft=false --latest
