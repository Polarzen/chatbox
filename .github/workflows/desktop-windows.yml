name: Chatbox Windows Installer upgrade
on: workflow_dispatch
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 42fd93bd0a19570f09c960b4092bf9d9ace7c1f5
          path: v17
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 48c4d6624bf6a2711a74acbde9e9eaf9db91fdce
          path: v18
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both pinned MSI packages
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*" -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
            if (-not $wix) { throw "WiX Toolset v3 is missing." }
            $env:PATH = "$($wix.FullName)\bin;$env:PATH"
          }
          Get-Command candle.exe,light.exe -ErrorAction Stop
          foreach ($checkout in 'v17','v18') {
            Push-Location $checkout
            try {
              git rev-parse HEAD
              .\gradlew.bat -p desktop --no-daemon packageMsi
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally { Pop-Location }
          }
      - name: Install 0.1.17 and upgrade in place to 0.1.18
        run: python -B qa/.github/workflows/verify-msi-upgrade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-upgrade-evidence
          path: ${{ runner.temp }}/chatbox-msi-transaction/evidence/
          retention-days: 7
          if-no-files-found: warn
