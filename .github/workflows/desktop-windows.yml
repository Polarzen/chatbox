name: Chatbox Windows Installer upgrade
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 0.1.19 commit SHA from feature/unified-device-sync
        required: true
        type: string
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      BASELINE_SHA: f5d327d521ed712852e710a4dbb94b454c3a7823
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Require an immutable candidate SHA
        shell: pwsh
        run: |
          if ($env:CANDIDATE_SHA -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'candidate_sha must be a full lowercase Git commit SHA.'
          }
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: v18
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: v19
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both pinned MSI packages
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*" -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
            if (-not $wix) { throw "WiX Toolset v3 is missing." }
            $env:PATH = "$($wix.FullName)\bin;$env:PATH"
          }
          Get-Command candle.exe,light.exe -ErrorAction Stop
          foreach ($checkout in 'v18','v19') {
            Push-Location $checkout
            try {
              $expected = if ($checkout -eq 'v18') { $env:BASELINE_SHA } else { $env:CANDIDATE_SHA }
              if ((git rev-parse HEAD) -cne $expected) { throw "Unexpected commit for $checkout" }
              .\gradlew.bat -p desktop --no-daemon packageMsi
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally { Pop-Location }
          }
      - name: Install 0.1.18 and upgrade in place to 0.1.19
        run: python -B qa/.github/workflows/verify-msi-upgrade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-upgrade-evidence
          path: ${{ runner.temp }}/chatbox-msi-transaction/evidence/
          retention-days: 7
          if-no-files-found: warn
